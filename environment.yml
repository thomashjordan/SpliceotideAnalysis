# Conda environment used to produce the published results.
#   conda env create -f environment.yml
#   conda activate lcms
name: lcms
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.1
  - pandas=2.2
  - scipy=1.16
  - scikit-learn=1.8
  - matplotlib=3.9
  - seaborn=0.13
  - biopython=1.86
  - pyteomics=4.7
  - lxml=5.3
  - openpyxl
  - regex
  - statsmodels=0.14
  - pypdf
  - dash
  - notebook
  - ipykernel
  # External (not on PyPI/conda-forge for all platforms): MUSCLE 5 for sequence alignments.
  # Download from https://drive5.com/muscle5/ and set the MUSCLE_EXE environment variable.
